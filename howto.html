<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nasıl Oynanır? — Quoridor</title>
    <meta name="theme-color" content="#0f172a">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="mobilemedia.css">
    <link rel="stylesheet" href="howto.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <!-- Oyunun tahtası ile birebir aynı çizici -->
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@7/dist/pixi.min.js"></script>
</head>

<body>
    <div id="app">
        <div id="toast-container"></div>

        <div id="tutorial-screen" class="screen active">
            <!-- Üst çubuk: geri + ilerleme -->
            <div class="tutorial-top">
                <button id="back-btn" class="icon-btn white" aria-label="Geri"><i
                        class="fa-solid fa-arrow-left"></i></button>
                <div class="tutorial-progress" id="progress-dots" aria-label="İlerleme"></div>
                <button id="skip-btn" class="icon-btn glass" title="Oyuna geç" aria-label="Oyuna geç"><i
                        class="fa-solid fa-play"></i></button>
            </div>

            <!-- Ders kartı -->
            <div class="lesson-card">
                <h2 id="lesson-title">Yükleniyor…</h2>
                <p id="lesson-text"></p>
                <div class="lesson-task" id="lesson-task">
                    <i class="fa-regular fa-circle" id="task-icon"></i>
                    <span id="task-text"></span>
                </div>
            </div>

            <!-- Tahta (oyundaki ile aynı yapı) -->
            <div class="board-container" id="board-wrap">
                <div id="board-canvas-container"></div>
            </div>

            <!-- Tüm güçlendirmelerin listelendiği son bölüm -->
            <div class="powerup-guide hidden" id="powerup-guide"></div>

            <!-- Duvar sürükleme kontrolleri (oyundakiyle aynı) -->
            <div class="controls" id="wall-controls">
                <button id="wall-drag-vertical" class="wall-drag-btn" data-orientation="vertical"
                    aria-label="Dikey duvarı tahtaya sürükle">
                    <span class="wall-glyph vertical"></span>
                    <span class="wall-drag-label">Dikey</span>
                </button>
                <div class="wall-count" id="wall-count">
                    <span id="wall-count-value">8</span>
                    <span class="wall-count-label">duvar</span>
                </div>
                <button id="wall-drag-horizontal" class="wall-drag-btn" data-orientation="horizontal"
                    aria-label="Yatay duvarı tahtaya sürükle">
                    <span class="wall-glyph horizontal"></span>
                    <span class="wall-drag-label">Yatay</span>
                </button>
            </div>

            <!-- Güçlendirme envanteri (ders gerektirdiğinde görünür) -->
            <div class="powerup-controls hidden" id="powerup-controls"></div>

            <!-- Alt aksiyon: ders bitince ilerlet -->
            <div class="tutorial-actions">
                <button id="next-btn" class="btn primary" disabled>
                    <span id="next-label">Görevi tamamla</span> <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="howto.js"></script>
</body>

</html>
